<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a14"/>
      <stop offset="100%" style="stop-color:#0f0a1e"/>
    </linearGradient>
    <linearGradient id="cosmic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#0a0a14;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="315" rx="400" ry="300" fill="url(#glow)" filter="url(#blur)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#cosmic)"/>
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.06"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <text x="600" y="255" font-family="system-ui,-apple-system,sans-serif" font-weight="700" font-size="72" text-anchor="middle" fill="url(#cosmic)">Bhavya Darda</text>
  <rect x="500" y="280" width="200" height="1" fill="#7c3aed" opacity="0.5"/>
  <text x="600" y="330" font-family="system-ui,-apple-system,sans-serif" font-weight="400" font-size="28" text-anchor="middle" fill="#c4b5fd" opacity="0.85">Full-Stack AI Developer &amp; Apple Specialist</text>
  <rect x="300" y="370" width="180" height="40" rx="20" fill="#7c3aed" opacity="0.18"/>
  <text x="390" y="395" font-family="system-ui,-apple-system,sans-serif" font-size="16" text-anchor="middle" fill="#a78bfa">Prompt Engineering</text>
  <rect x="510" y="370" width="180" height="40" rx="20" fill="#7c3aed" opacity="0.18"/>
  <text x="600" y="395" font-family="system-ui,-apple-system,sans-serif" font-size="16" text-anchor="middle" fill="#a78bfa">AI Agent Dev</text>
  <rect x="720" y="370" width="180" height="40" rx="20" fill="#7c3aed" opacity="0.18"/>
  <text x="810" y="395" font-family="system-ui,-apple-system,sans-serif" font-size="16" text-anchor="middle" fill="#a78bfa">Apple Inc.</text>
  <text x="600" y="560" font-family="ui-monospace,monospace" font-size="18" text-anchor="middle" fill="#6d28d9" opacity="0.7">bhavyadarda.dev</text>
